<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="stylesheet" href="src/styles/dispatch.css" />
    <link rel="stylesheet" href="src/styles/delivery.css" />
    <link rel="stylesheet" href="src/styles/mobile.css" />
    <style>
      .workbench {
        height: calc(100dvh - 64px) !important;
        min-height: 0 !important;
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        white-space: nowrap;
        gap: 4px;
        background: #08131d;
        padding: 6px;
        z-index: 20;
      }
      nav > * {
        flex-shrink: 0;
      }
      nav button {
        min-height: 40px;
        background: #122b3d;
        color: white;
        border: 1px solid #569cd6;
        font: 12px monospace;
      }
      #checkpoint {
        color: #a9dfb0;
        font: 12px monospace;
      }
    </style>
  </head>
  <body data-mode="running">
    <main>
      <div class="kitchen">
        <section class="workbench">
          <div id="scene" tabindex="0"><p id="loading">loading</p></div>
        </section>
      </div>
    </main>
    <nav aria-label="Junction review">
      <label><input id="reduced" type="checkbox" /> reduced motion</label>
      <button data-hazard="80,0">jump barrier</button><button data-hazard="155,0">duck beam</button
      ><button data-hazard="200,1">roadworks</button><button data-hazard="125,-1">parked car</button
      ><button id="second">step 1s</button
      ><label><input id="pilot" type="checkbox" checked /> replay inputs</label
      ><button data-distance="0">opening tow</button><button id="free">free skate</button
      ><button data-distance="330">freight approach</button
      ><button data-distance="390">before release</button
      ><button data-distance="420">freight turn</button
      ><button data-distance="810">traffic approach</button
      ><button data-distance="900">traffic turn</button
      ><button data-distance="445">freight ramp</button
      ><button data-distance="932">traffic ramp</button><button id="step">step 0.1s</button
      ><button id="play">play</button><output id="checkpoint"></output>
    </nav>
    <script type="module" src="junction-review.js"></script>
  </body>
</html>
